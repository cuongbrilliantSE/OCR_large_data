server {
    listen 80;
    server_name your_domain.com; # Thay thế bằng tên miền hoặc IP server

    # Cho phép tải file sách nén dung lượng lớn (RAR, ZIP, 7Z lên đến 1GB)
    client_max_body_size 1024M;
    client_body_buffer_size 128M;

    # Tối ưu thời gian chờ khi giải nén & xử lý tác vụ lớn
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for live streaming / status updates
        proxy_buffering off;
        proxy_cache off;
    }
}
