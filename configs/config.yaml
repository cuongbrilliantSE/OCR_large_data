system:
  num_workers: 4              # Số luồng xử lý song song (Gemini API là I/O bound nên có thể để 4 - 8)
  batch_size: 20              # Batch size gửi cho dispatcher
  max_tasks_per_child: 500    # Khởi động lại worker sau mỗi 500 ảnh để giải phóng RAM

paths:
  input_dir: "data/input"
  output_dir: "data/output"
  db_path: "data/tracker.db"
  log_dir: "logs"

ocr:
  # Lựa chọn engine:
  # 1. "gemini"  : KHUYÊN DÙNG - Độ chính xác 100% tiếng Việt, đọc hiểu ngữ cảnh, ngắt đoạn, dấu câu, tên riêng chuẩn xác
  # 2. "vietocr" : Chạy OFFLINE không cần mạng/API key - Model Transformer chuyên biệt tiếng Việt
  # 3. "rapidocr": Chạy OFFLINE siêu nhanh qua ONNX
  # 4. "easyocr" : Chạy OFFLINE với PyTorch
  engine: "gemini"

  # Cấu hình Gemini Vision AI
  gemini:
    api_key: ""               # Để trống nếu đã cấu hình trong file .env hoặc biến môi trường GEMINI_API_KEY
    model_name: "gemini-2.5-flash" # gemini-2.5-flash hoặc gemini-2.0-flash (nhanh, chính xác nhất)
    temperature: 0.0
    max_retries: 3

  # Cấu hình VietOCR (khi dùng engine: vietocr)
  vietocr_model: "vgg_transformer"
  vietocr_device: "cpu"       # "cpu" hoặc "cuda:0" nếu có GPU

  # Cấu hình RapidOCR / EasyOCR
  use_angle_cls: true
  min_score_thresh: 0.3

preprocessing:
  enable: true
  max_dimension: 2560         # 2560px đảm bảo độ sắc nét cho chữ in nhỏ và dấu thanh
  auto_orient: true           # Tự động phát hiện và xoay ảnh chụp nghiêng 90/270 độ
  auto_contrast: false        # Tự động cân bằng tương phản nếu ảnh quá tối/sáng
  split_double_pages: false   # True nếu muốn tách 1 ảnh sách 2 trang thành 2 lượt đọc

output:
  format: "both"              # txt / jsonl / both
  save_confidence: true       # Lưu độ tin cậy của từng khối văn bản
  mirror_folder_structure: true # Giữ nguyên cấu trúc thư mục con từ input sang output
