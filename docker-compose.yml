version: '3.8'

services:
  ocr-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr_studio_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/books"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

